[package]
name = "local-dictation"
version = "0.1.0"
description = "Tiny local dictation: Whisper speech-to-text typed into any application"
license = "GPL-3.0-only"
repository = "https://github.com/kz370/Open-Local-Ai-Assistant"
authors = ["Khaled Morsi"]
edition = "2021"

[lib]
name = "local_dictation_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.19"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
sha2 = "0.11.0"
hex = "0.4.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
auto-launch = "0.5"
# Shared linking so the ONNX Runtime DLLs sit next to the exe and an optional
# CUDA pack can take their place at launch (see gpu.rs).
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
# Raw C API for switching Whisper's language on a loaded model (stt/engine.rs).
sherpa-onnx-sys = { version = "1.13.8", default-features = false, features = ["shared"] }
cpal = "0.18.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "native-tls", "http2"] }
futures-util = "0.3.34"
enigo = "0.6.1"
arboard = "3.6.1"
tar = "0.4.46"
zip = { version = "2", default-features = false, features = ["deflate"] }
bzip2 = "0.6.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[[bin]]
name = "local-dictation"
path = "src/main.rs"
